name: Release

# Pushing a tag like v1.0.0 builds a signed release APK and attaches it to a
# new GitHub Release. Requires four repository secrets, set once under
# Settings > Secrets and variables > Actions (see README > Signing):
#   KEYSTORE_BASE64    base64 of the .jks/.keystore file
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        run: base64 -d <<< "${{ secrets.KEYSTORE_BASE64 }}" > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          KOTONOTE_STORE_FILE: ${{ runner.temp }}/release.keystore
          KOTONOTE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KOTONOTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KOTONOTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "kotonote-${{ github.ref_name }}.apk"

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: kotonote-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: true
